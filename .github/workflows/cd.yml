name: CD — Deploy Cloudflare (Pulumi + Workers + Pages)

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Stack (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar uv e Python para Pulumi
        uses: astral-sh/setup-uv@v4

      - name: Instalar Pulumi CLI
        uses: pulumi/actions@v6

      - name: Provisionar Infraestrutura Cloudflare via Pulumi (${{ env.TARGET_ENV }})
        if: env.PULUMI_ACCESS_TOKEN != '' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: pulumi-prj
        run: |
          uv sync
          uv run pulumi stack select "${TARGET_ENV}"
          uv run pulumi up --stack "${TARGET_ENV}" --yes

      - name: Deploy do Backend no Cloudflare Workers (${{ env.TARGET_ENV }})
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: |
          npm ci
          npx wrangler deploy --env "${TARGET_ENV}"

      - name: Build e Deploy do Frontend no Cloudflare Pages (${{ env.TARGET_ENV }})
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name "mineboard-guestbook-${TARGET_ENV}"
